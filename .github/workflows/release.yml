name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/install.sh
            src/vnu
